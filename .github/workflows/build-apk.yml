name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压并组装
        run: |
          [ -f source.zip ] && unzip -o source.zip && rm -f source.zip
          mkdir -p www && cp -r index.html css js icons manifest.webmanifest sw.js www/
          ls -1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx @capacitor/assets generate --android || true
      - run: npx cap add android || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: moneybook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

